# "What happens next" guides: step-by-step sequences for stressful moments.
# Each step: title, when (optional), happens (what usually happens), you (what you can do), say (optional), law (optional link).
# Sentences 25 words or fewer. Plain words. No predictions about any one case.

- slug: traffic-stop
  title: "A traffic stop"
  h1: "Pulled over: what happens next, step by step"
  icon: car
  summary: "What usually happens from the moment you see lights behind you, and what you can do at each step."
  seo_title: "Pulled Over? What Happens Next, Step by Step"
  seo_description: "What usually happens at a traffic stop, from the lights behind you to the ticket, and what you can say and do at each step. Plain English."
  intro: "Most traffic stops end with a warning or a ticket. Knowing the steps ahead of time can make the stop feel less scary."
  steps:
    - title: "You see lights behind you"
      when: "The first minute"
      happens:
        - "An officer signals you to pull over."
      you:
        - "Signal, slow down, and pull over to the right when it is safe."
        - "Turn off the engine. At night, turn on the inside light."
        - "Roll down your window. Put your hands on the steering wheel."
        - "Passengers should keep their hands where officers can see them."
    - title: "The officer comes to your window"
      when: "A few minutes"
      happens:
        - "The officer usually says why you were stopped."
        - "They ask for your license, registration, and proof of insurance."
      you:
        - "You must show these documents."
        - "Say where they are before you reach for them."
        - "If you have a disability that affects how you communicate, you can say so or show a card."
      say: "My license is in my wallet. I'm going to reach for it now."
      law:
        label: "Communicating with police"
        href: /situations/communicating-with-police/
    - title: "The officer asks questions"
      happens:
        - "They may ask where you are going, where you have been, or if you know why they stopped you."
      you:
        - "You can choose not to answer questions beyond your documents."
        - "In some states, you must give your name if asked."
        - "Passengers generally do not have to answer questions."
        - "Stay calm. Do not argue at the roadside."
      say: "I am exercising my right to remain silent."
      law:
        label: "Fifth Amendment"
        href: /amendments/5/
    - title: "You may be asked to step out"
      happens:
        - "An officer can order the driver and passengers out of the car during a lawful stop."
      you:
        - "Get out if you are told to. Move slowly and keep your hands visible."
        - "If an officer reasonably suspects you have a weapon, they can pat down your outer clothing."
    - title: "The officer may ask to search"
      happens:
        - "They may ask to look in your car or your bag."
        - "Police can search a car without consent if they have probable cause."
      you:
        - "You can say no to a search. Say it clearly and calmly."
        - "Do not physically stop a search, even if you did not agree to it."
        - "A stop can't be stretched out just to wait for a drug dog, unless police have reasonable suspicion."
      say: "I do not consent to a search."
      law:
        label: "Fourth Amendment"
        href: /amendments/4/
    - title: "The stop ends"
      happens:
        - "Most stops end with a warning or a ticket. Some end in an arrest."
        - "In many states, signing a ticket only promises that you will respond to it. It is not an admission."
        - "Refusing to sign can lead to arrest in some states. Sign, then contest the ticket later."
      you:
        - "If you are not sure the stop is over, ask."
        - "If you are arrested, see the next guide."
      say: "Am I free to go?"
      law:
        label: "After an arrest"
        href: /what-happens-next/arrest/
    - title: "Afterward"
      happens:
        - "A ticket tells you how to pay it or how to contest it in court."
      you:
        - "Write down what happened, the time, and the officer's name or badge number."
        - "You can contest a ticket in court by the date on it."
        - "If you think police acted wrongly, you can file a complaint with the police department."
  faq:
    - q: "Do I have to answer police questions at a traffic stop?"
      a: "You must show your license, registration, and proof of insurance. You can choose not to answer other questions. In some states, you must give your name."
    - q: "Can police search my car without my permission?"
      a: "Yes, if they have probable cause to believe it holds evidence of a crime. You can still say \"I do not consent to a search.\" Don't physically stop them."
    - q: "Does signing a ticket mean I admit I'm guilty?"
      a: "In many states, no. Signing usually means you promise to respond to the ticket. You can still contest it in court."

- slug: arrest
  title: "After an arrest"
  h1: "Arrested: what happens next, step by step"
  icon: lock
  summary: "What usually happens after an arrest, from the arrest itself to the first court date, and your rights at each step."
  seo_title: "Arrested? What Happens Next, Step by Step"
  seo_description: "What usually happens after an arrest: booking, a phone call, seeing a judge, bail, and a lawyer. Your rights at each step, in plain English."
  intro: "An arrest is not a conviction. You keep your rights at every step, and you will get a chance to see a judge."
  steps:
    - title: "The arrest"
      when: "The first minutes"
      happens:
        - "An officer tells you that you are under arrest. You may be handcuffed."
        - "Police can search you and the area right around you."
      you:
        - "Do not resist, run, or argue, even if you think the arrest is wrong."
        - "Say clearly that you want to stay silent and want a lawyer. Then stop talking."
        - "Police generally need a warrant to search your phone."
      say: "I am exercising my right to remain silent. I want a lawyer."
      law:
        label: "Being questioned by police"
        href: /situations/being-questioned-by-police/
    - title: "Questioning and Miranda warnings"
      happens:
        - "Before police question you in custody, they must tell you your rights. These are called Miranda warnings."
        - "If they don't, what you say may not be usable at trial. The arrest itself can still stand."
      you:
        - "You can stop talking at any time. Say out loud that you want to stay silent."
        - "If you clearly say \"I want a lawyer,\" police must stop questioning you. Words like \"maybe\" may not count."
      law:
        label: "Fifth Amendment"
        href: /amendments/5/
    - title: "Booking"
      when: "A few hours"
      happens:
        - "At the station, police take your fingerprints and photo."
        - "They take your belongings and list them."
        - "They ask basic questions, like your name, address, and date of birth."
      you:
        - "Answering basic booking questions is normal. Do not talk about what happened."
        - "Ask for a receipt for your belongings."
    - title: "A phone call"
      happens:
        - "Many states give you a phone call after booking. The rules differ by state."
      you:
        - "Call someone who can help you find a lawyer or arrange bail."
        - "Jail phone calls are usually recorded. Do not talk about your case on them."
    - title: "Seeing a judge"
      when: "Usually within a day or two"
      happens:
        - "If you were arrested without a warrant, a judge must review your arrest, usually within 48 hours. Weekends count."
        - "The judge tells you the charges and decides on bail or release."
      you:
        - "If you cannot afford a lawyer, ask for one. A judge can't send you to jail unless you had a lawyer or gave up that right."
        - "The Eighth Amendment bans excessive bail."
      say: "I can't afford a lawyer. I would like a public defender."
      law:
        label: "Sixth Amendment"
        href: /amendments/6/
    - title: "Talking with your lawyer"
      happens:
        - "Your lawyer explains the charges and your choices."
      you:
        - "Tell your lawyer everything. What you tell your lawyer is private."
        - "If you are not a U.S. citizen, tell your lawyer. Your lawyer must tell you if a plea could lead to deportation."
        - "Do not plead guilty before you talk with a lawyer."
    - title: "What comes next"
      happens:
        - "The case may be dropped, settled with a plea deal, or go to trial."
        - "You have the right to a speedy, public trial. If the crime can bring more than six months in jail, you can have a jury."
      you:
        - "Go to every court date. Missing one can lead to a new arrest warrant."
        - "Keep copies of every paper you get."
  faq:
    - q: "How long can police hold me before a judge reviews my arrest?"
      a: "If you were arrested without a warrant, generally no more than 48 hours, weekends included. The Supreme Court said this in County of Riverside v. McLaughlin (1991). Some states require it sooner."
    - q: "What if police didn't read me my rights?"
      a: "Your statements during questioning may not be usable at trial. The arrest can still be valid. A lawyer can tell you what it means for your case."
    - q: "Do I get a free lawyer if I'm arrested?"
      a: "If you can't afford one, ask the judge for a public defender. Under the Sixth Amendment, a judge can't send you to jail unless you had a lawyer or gave up that right."
    - q: "I'm not a citizen. What should I tell my lawyer?"
      a: "Tell your lawyer you are not a U.S. citizen. In Padilla v. Kentucky (2010), the Supreme Court said lawyers must warn clients if a guilty plea could lead to deportation."

- slug: election-day
  title: "Election Day"
  h1: "Voting on Election Day: what happens next, step by step"
  icon: ballot
  summary: "What happens at your polling place, from getting in line to casting your ballot, and what to do if something goes wrong."
  seo_title: "Voting on Election Day: What Happens, Step by Step"
  seo_description: "What happens at the polling place, from the line to the ballot box, and what to do if your name isn't on the list or something goes wrong."
  intro: "Voting usually takes a few minutes once you reach the front of the line. Rules differ by state, so check yours at vote.gov first."
  steps:
    - title: "Before you go"
      when: "Days before"
      happens:
        - "Each state sets its own rules for registration, ID, and polling places."
      you:
        - "Check that you are registered at vote.gov."
        - "Look up your polling place. It may not be the closest one."
        - "Check what ID your state asks for, if any."
        - "Only U.S. citizens can vote in federal and state elections."
        - "Voting in a federal election when you are not a citizen is a crime. It can lead to deportation."
      law:
        label: "First-time voter"
        href: /situations/first-time-voter/
    - title: "Get in line"
      when: "On Election Day"
      happens:
        - "There may be a line. Poll hours are set by your state."
      you:
        - "If you are in line when the polls close, stay in line. In most states, you can still vote."
      say: "I was in line before the polls closed. I want to vote."
    - title: "Check in"
      happens:
        - "A poll worker looks for your name and may ask for ID."
      you:
        - "Give your name and address."
        - "If your state asks for ID, show it."
    - title: "If your name isn't on the list"
      happens:
        - "You may be at the wrong polling place, or there may be a mistake in the records."
      you:
        - "Ask the poll worker to check again, including spelling and your address."
        - "Ask if you are at the right polling place."
        - "If you are still not found, ask for a provisional ballot. In federal elections, federal law says you can cast one."
        - "A provisional ballot may not count if you are at the wrong polling place. Ask where you should vote."
      say: "I would like to cast a provisional ballot."
      law:
        label: "Turned away from voting"
        href: /situations/turned-away-from-voting/
    - title: "Mark your ballot"
      happens:
        - "You vote in private. Polling places must have a way for voters with disabilities to vote privately and on their own."
      you:
        - "If a disability or trouble reading makes voting hard, you can bring a helper. It can't be your boss or a union official."
        - "If you make a mistake, ask for a new ballot before you turn it in. Most places allow this."
      say: "I made a mistake. May I have a new ballot?"
    - title: "Cast your ballot"
      happens:
        - "You put your ballot into the scanner or ballot box, or submit it on a machine."
      you:
        - "If you cast a provisional ballot, ask how to check whether it was counted."
        - "Some states ask provisional voters to show ID or sign a form within a few days. Ask what you need to do."
    - title: "If something goes wrong"
      happens:
        - "Threatening or scaring voters is illegal under federal law."
      you:
        - "Call the Election Protection Hotline: 1-866-OUR-VOTE (1-866-687-8683)."
        - "In Spanish: 1-888-VE-Y-VOTA (1-888-839-8682). In Asian languages: 1-888-API-VOTE (1-888-274-8683). In Arabic: 1-844-YALLA-US (1-844-925-5287)."
        - "Write down what happened, the time, and who was involved."
  faq:
    - q: "What if my name isn't on the voter list?"
      a: "Ask the poll worker to check again and confirm you are at the right polling place. If you still aren't found, ask for a provisional ballot. In federal elections, federal law says you can cast one."
    - q: "Can I get a new ballot if I make a mistake?"
      a: "Usually, yes, if you haven't turned it in yet. Ask a poll worker for a new one. Most states allow a few replacement ballots."
    - q: "What should I do if someone tries to scare me at the polls?"
      a: "Tell a poll worker and call the Election Protection Hotline at 1-866-OUR-VOTE (1-866-687-8683). Threatening voters is illegal under federal law."
